[package]
name = "hcrrw4-luminia-runner"
version = "0.1.1-pre2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A runtime for a simple language"
repository = "https://github.com/Not-A-Normal-Robot/hackclub-resolution-rust-w4"

[dependencies]
either = "1.15.0"
lalrpop-util = { version = "0.23.1", features = ["lexer", "unicode"] }
